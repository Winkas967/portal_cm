<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha — Portal CM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app-layout auth-checking">

    <aside th:replace="~{fragments/sidebar :: sidebar('fichas')}"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <main class="main">
        <div class="topbar">
            <div class="topbar-heading">
                <button type="button" class="mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Abrir menu">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <div>
                    <div class="breadcrumb"><a href="/fichas">Fichas</a> / <span id="crumb">Ficha</span></div>
                    <div class="page-title" id="patient-title">Carregando...</div>
                    <div class="page-subtitle" id="patient-subtitle"></div>
                </div>
            </div>
            <div class="topbar-actions">
                <button type="button" class="btn-secondary" id="print-button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                    Imprimir
                </button>
                <a href="/fichas" class="btn-secondary">Voltar</a>
            </div>
        </div>

        <div id="detail" class="hidden" style="display: flex; flex-direction: column; gap: 22px;">
            <div class="detail-head">
                <div class="detail-id"><small>Ficha</small><strong id="detail-number">Nº —</strong><small>FOR-NSP-001</small></div>
                <div class="meta-grid">
                    <div><div class="meta-label">Setor</div><div class="meta-value" id="meta-sector"></div></div>
                    <div><div class="meta-label">Data do evento</div><div class="meta-value" id="meta-event"></div></div>
                    <div><div class="meta-label">Notificada em</div><div class="meta-value" id="meta-notified"></div></div>
                    <div><div class="meta-label">Notificador</div><div class="meta-value" id="meta-notifier"></div></div>
                </div>
            </div>

            <div class="detail-grid">
                <div class="detail-column">
                    <div class="panel">
                        <div class="panel-title">Incidente / evento adverso</div>
                        <div class="chips" id="detail-types"></div>
                        <div id="detail-other" class="hidden">
                            <div class="meta-label" style="margin-bottom: 4px;">Outros</div>
                            <div class="text-block" id="detail-other-text"></div>
                        </div>
                    </div>
                    <div class="panel">
                        <div class="panel-title">Descrição do evento</div>
                        <div id="detail-description"></div>
                        <div class="panel-title" style="margin-top: 6px;">Ações imediatas</div>
                        <div id="detail-actions"></div>
                        <div class="panel-title" style="margin-top: 6px;">Não conformidade</div>
                        <div id="detail-nonconformity"></div>
                    </div>
                </div>

                <div class="detail-column">
                    <div class="panel hidden" id="defect-panel" style="border-color: var(--laranja);">
                        <div class="panel-header"><div class="panel-title" id="defect-title"></div><span class="chip" id="defect-chip"></span></div>
                        <dl class="kv" id="defect-list"></dl>
                    </div>
                    <div class="panel">
                        <div class="panel-title">Paciente</div>
                        <dl class="kv" id="patient-list"></dl>
                    </div>
                    <div class="panel">
                        <div class="panel-header"><div class="panel-title">Anexos</div><span class="panel-sub" id="attach-count"></span></div>
                        <div id="attach-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="/js/notifications.js"></script>
<script src="/js/common.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/ficha-detalhe.js"></script>
</body>
</html>
