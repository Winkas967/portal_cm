<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fichas — Portal CM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app-layout auth-checking">

    <aside th:replace="~{fragments/sidebar :: sidebar('fichas')}"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <main class="main">
        <div class="topbar">
            <div class="topbar-heading">
                <button type="button" class="mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Abrir menu">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <div>
                    <div class="page-title">Fichas de notificação</div>
                    <div class="page-subtitle" id="page-subtitle">Incidentes e eventos adversos registrados</div>
                </div>
            </div>
            <div class="topbar-actions">
                <a href="/fichas/nova" class="btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                    Nova notificação
                </a>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon verde"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#00995d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></div>
                <div><div class="stat-value" id="stat-today">—</div><div class="stat-label">Eventos hoje</div></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon teal"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#004e4c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg></div>
                <div><div class="stat-value" id="stat-week">—</div><div class="stat-label">Últimos 7 dias</div></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon lima"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6f8a1f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6a1 1 0 0 1 1 1v1H8V4a1 1 0 0 1 1-1Z"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg></div>
                <div><div class="stat-value" id="stat-month">—</div><div class="stat-label" id="stat-month-label">No mês</div></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon laranja"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#f47920" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg></div>
                <div><div class="stat-value" id="stat-vigilance">—</div><div class="stat-label">Farmaco/tecno no mês</div></div>
            </div>
        </div>

        <div class="panel">
            <form class="filters" id="filters-form">
                <div class="form-group">
                    <label class="form-label" for="filter-sector">Setor</label>
                    <select class="form-select" id="filter-sector"><option value="">Todos os setores</option></select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="filter-type">Tipo de incidente</label>
                    <select class="form-select" id="filter-type"><option value="">Todos os tipos</option></select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="filter-from">Evento de</label>
                    <input class="form-input" type="date" id="filter-from">
                </div>
                <div class="form-group">
                    <label class="form-label" for="filter-to">até</label>
                    <input class="form-input" type="date" id="filter-to">
                </div>
                <button type="button" class="btn-secondary" id="filters-clear">Limpar</button>
            </form>

            <div class="table-wrap">
                <table class="table">
                    <thead>
                    <tr>
                        <th style="width: 70px;">Nº</th>
                        <th>Paciente</th>
                        <th>Setor</th>
                        <th>Tipo de incidente</th>
                        <th>Data do evento</th>
                        <th>Notificador</th>
                        <th style="width: 50px;"></th>
                    </tr>
                    </thead>
                    <tbody id="fichas-body">
                    <tr><td colspan="7" class="table-empty">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination">
                <span id="page-summary"></span>
                <div class="pager">
                    <button type="button" class="pager-btn" id="prev-page" aria-label="Página anterior">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                    </button>
                    <span id="page-info">Página 1 de 1</span>
                    <button type="button" class="pager-btn" id="next-page" aria-label="Próxima página">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="/js/notifications.js"></script>
<script src="/js/common.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/fichas.js"></script>
</body>
</html>
